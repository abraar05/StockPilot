name: Build Android APK

# Produces a signed, installable APK for StockPilot with no local Android
# Studio required. Upload the artifact from the run summary.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_B64   base64 of your upload keystore (.jks)
#   ANDROID_KEY_ALIAS      e.g. stockpilot-upload
#   ANDROID_KEY_PASSWORD   keystore password
#
# The repository's stock GitHub-hosted runner already has the Android SDK,
# so only the secrets are missing.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    name: Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Capacitor / npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: [ -d android/app ] || npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Decode keystore
        working-directory: android
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > app/stockpilot-upload.jks
          ls -l app/stockpilot-upload.jks

      - name: Write signing config
        working-directory: android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> app/build.gradle <<'EOF'

          android {
            signingConfigs {
              release {
                storeFile file('stockpilot-upload.jks')
                storePassword System.getenv('ANDROID_KEY_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }
          }
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK to the run
        uses: actions/upload-artifact@v4
        with:
          name: stockpilot-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach APK to the latest release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk

  bundle:
    name: App Bundle (AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: [ -d android/app ] || npx cap add android
      - run: npx cap sync android
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: stockpilot-aab
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error