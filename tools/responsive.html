<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>StockPilot — responsive harness</title>
<style>
  body { margin: 0; background: #1b1f27; color: #e6eaf2; font: 13px/1.4 system-ui, sans-serif; }
  .row { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-size: 11px; opacity: .7; padding: 6px 2px; text-transform: uppercase; letter-spacing: .06em; }
  iframe { border: 0; display: block; background: #0a0d13; border-radius: 12px; }
  .p390  { width: 390px; height: 780px; }
  .p360  { width: 360px; height: 740px; }
  .p430  { width: 430px; height: 820px; }
</style>
</head>
<body>
  <div class="row">
    <figure><figcaption>iPhone 14 · 390</figcaption><iframe class="p390" src="/index.html?device=390" title="390"></iframe></figure>
    <figure><figcaption>Small Android · 360</figcaption><iframe class="p360" src="/index.html?device=360" title="360"></iframe></figure>
    <figure><figcaption>iPhone Pro Max · 430</figcaption><iframe class="p430" src="/index.html?device=430" title="430"></iframe></figure>
  </div>
</body>
</html>
